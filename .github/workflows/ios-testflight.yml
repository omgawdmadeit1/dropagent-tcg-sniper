# DropAgent → TestFlight via GitHub Actions (no local Mac required).
# Same path as Come Through. Trigger: Actions → "iOS TestFlight" → Run workflow
# One-time secrets: APPLE_TEAM_ID, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8
# Copy the same values you already set on omgawdmadeit1/come-through.
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "What testers will see for this build"
        required: false
        default: "DropAgent TestFlight build"
  push:
    tags:
      - "ios-v*"

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    name: Build & upload
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Raw secrets (may include trailing newlines from Windows paste)
      APPLE_TEAM_ID_RAW: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID_RAW: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID_RAW: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
      APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
      CHANGELOG: ${{ github.event.inputs.changelog || 'DropAgent TestFlight build' }}
      BUILD_NUMBER: ${{ github.run_number }}
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize Apple secrets (strip whitespace / newlines)
        run: |
          # Windows paste often adds \r\n — that breaks xcodebuild (exit 127).
          strip() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          TEAM="$(strip "$APPLE_TEAM_ID_RAW")"
          KEY_ID="$(strip "$APPLE_API_KEY_ID_RAW")"
          ISSUER="$(strip "$APPLE_API_ISSUER_ID_RAW")"

          missing=0
          if [ -z "$TEAM" ]; then echo "::error::APPLE_TEAM_ID empty"; missing=1; fi
          if [ -z "$KEY_ID" ]; then echo "::error::APPLE_API_KEY_ID empty"; missing=1; fi
          if [ -z "$ISSUER" ]; then echo "::error::APPLE_API_ISSUER_ID empty"; missing=1; fi
          if [ -z "$APPLE_API_KEY_P8" ]; then echo "::error::APPLE_API_KEY_P8 empty"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "Add secrets at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "Copy the same 4 Apple secrets from the come-through repo."
            exit 1
          fi

          # Length-only diagnostics (never print secret values)
          echo "APPLE_TEAM_ID length=${#TEAM}"
          echo "APPLE_API_KEY_ID length=${#KEY_ID}"
          echo "APPLE_API_ISSUER_ID length=${#ISSUER}"
          echo "APPLE_API_KEY_P8 length=${#APPLE_API_KEY_P8}"

          {
            echo "APPLE_TEAM_ID=$TEAM"
            echo "APPLE_API_KEY_ID=$KEY_ID"
            echo "APPLE_API_ISSUER_ID=$ISSUER"
          } >> "$GITHUB_ENV"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Sync Capacitor iOS (plugins + permissions)
        run: |
          npx cap sync ios
          node scripts/ios/apply-ios-permissions.mjs
          if [ -d ios-assets/AppIcon.appiconset ]; then
            rm -rf ios/App/App/Assets.xcassets/AppIcon.appiconset
            cp -R ios-assets/AppIcon.appiconset ios/App/App/Assets.xcassets/AppIcon.appiconset
          fi
          if [ -f ios-assets/PrivacyInfo.xcprivacy ]; then
            cp ios-assets/PrivacyInfo.xcprivacy ios/App/App/PrivacyInfo.xcprivacy
          fi

      - name: Inject Apple Team ID into Xcode project
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          team = os.environ["APPLE_TEAM_ID"].strip()
          assert team and "\n" not in team and "\r" not in team, "bad team id"
          p = pathlib.Path("ios/App/App.xcodeproj/project.pbxproj")
          text = p.read_text()
          # Always set DEVELOPMENT_TEAM on App target configs
          if "DEVELOPMENT_TEAM" in text:
              text = re.sub(r"DEVELOPMENT_TEAM = [^;]+;", f"DEVELOPMENT_TEAM = {team};", text)
          text = text.replace(
              "CODE_SIGN_STYLE = Automatic;",
              f"CODE_SIGN_STYLE = Automatic;\n\t\t\t\tDEVELOPMENT_TEAM = {team};",
          )
          lines = text.splitlines()
          cleaned = []
          for line in lines:
              if "DEVELOPMENT_TEAM" in line and cleaned and "DEVELOPMENT_TEAM" in cleaned[-1]:
                  cleaned[-1] = line  # keep latest
                  continue
              cleaned.append(line)
          p.write_text("\n".join(cleaned) + "\n")
          teams = [ln.strip() for ln in p.read_text().splitlines() if "DEVELOPMENT_TEAM" in ln]
          print("DEVELOPMENT_TEAM lines:", len(teams))
          for ln in teams:
              val = ln.split("=",1)[-1].strip().rstrip(";")
              print(" team value length=", len(val))
          PY

      - name: Setup Ruby / Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Fastlane gems
        run: |
          gem install bundler --no-document
          bundle config set path 'vendor/bundle'
          # Retry on flaky rubygems.org (exit 17 / network timeout)
          for i in 1 2 3 4 5; do
            if bundle install --jobs 4 --retry 3; then
              exit 0
            fi
            echo "bundle install failed (attempt $i), sleeping..."
            sleep $((i * 15))
          done
          exit 1

      - name: Write AuthKey.p8 for xcodebuild
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_FILE="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          # Normalize P8: strip CR, ensure trailing newline after END line
          if printf '%s' "$APPLE_API_KEY_P8" | tr -d '\r' | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$APPLE_API_KEY_P8" | tr -d '\r' > "$KEY_FILE"
            # ensure file ends with newline
            [ -n "$(tail -c1 "$KEY_FILE")" ] && echo >> "$KEY_FILE"
          else
            printf '%s' "$APPLE_API_KEY_P8" | tr -d '\r\n' | base64 --decode > "$KEY_FILE"
          fi
          echo "AUTH_KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"
          # size only
          wc -c "$KEY_FILE"

      - name: Fastlane beta → TestFlight
        run: bundle exec fastlane ios beta

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DropAgent-ipa
          path: |
            build/*.ipa
            build/*.p12
            build/*.cer
          if-no-files-found: ignore
          retention-days: 14
