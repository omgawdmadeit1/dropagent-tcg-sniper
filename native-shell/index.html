<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#08080a" />
    <title>DropAgent</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #08080a;
        color: #f2f2f4;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        text-align: center;
      }
      .mark {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        margin: 0 auto 1.25rem;
        background: linear-gradient(145deg, #1a3d2e, #111114);
        border: 1px solid #2a2a32;
        display: grid;
        place-items: center;
        color: #3ecf8e;
        font-size: 1.15rem;
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0.75rem auto 0;
        max-width: 22rem;
        color: #9b9ba6;
        line-height: 1.5;
        font-size: 0.95rem;
      }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        color: #04140c;
        background: #3ecf8e;
        text-decoration: none;
        font-weight: 600;
        padding: 0.85rem 1.25rem;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <div class="mark" aria-hidden="true">DA</div>
        <h1>DropAgent</h1>
        <p>
          Opening multi-retailer TCG snipe alerts. If this screen stays up, check your
          connection and try again.
        </p>
        <a href="https://dropagent.lvlltd.com/">Open DropAgent</a>
      </div>
    </main>
  </body>
</html>
